[Alert - SSH Brute Force Detected]
action.email = 1
action.email.to = soc@example.com
action.email.subject = Splunk Alert: SSH Brute Force Detected from $result.src_ip$
action.notable = 1
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 30m
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=ssh_security sourcetype=linux_secure status=failure | stats count by src_ip | where count > 10

[Alert - Successful Login After Brute Force]
action.email = 1
action.email.to = soc-tier2@example.com
action.email.subject = CRITICAL: Successful Login After SSH Brute Force from $result.src_ip$
action.webhook = 1
action.webhook.uri = https://jira.example.com/rest/api/2/issue (or your webhook URL)
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 60m
alert.track = 1
counttype = number of events
cron_schedule = * * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=ssh_security sourcetype=linux_secure (status=failure OR status=success) | transaction src_ip maxspan=10m | search status=failure AND status=success | eval fail_count=mvcount(mvfilter(status=="failure")) | where fail_count >= 5

[Alert - Mass Username Enumeration]
alert.suppress = 1
alert.suppress.fields = src_ip
alert.suppress.period = 15m
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=ssh_security sourcetype=linux_secure status=failure | stats dc(username) as distinct_usernames by src_ip | where distinct_usernames > 5
